<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilih Wira — Legenda Hutan Belantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PILIH WIRA — skrin pilih watak
   Semua warna wira dikawal oleh CSS variable --a & --rgb
   ========================================================= */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04070a;overflow:hidden}
body{font-family:Rajdhani,sans-serif;color:#e9e4d8}

/* Pentas 1440x900 yang di-skala ikut saiz skrin */
#pw-viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04070a}
#pw{--a:#ff9a3c;--rgb:255,154,60;width:1440px;height:900px;position:relative;overflow:hidden;flex:none;transform-origin:center center;
  background:linear-gradient(180deg,#0a1418 0%,#060b0e 55%,#030507 100%);transition:--a .4s}
#pw *{transition:color .4s, border-color .4s, background-color .4s, box-shadow .4s}

.pw-glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 46% 38%,rgba(var(--rgb),.22) 0%,rgba(4,7,10,0) 70%)}
.pw-moon{position:absolute;left:560px;top:70px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fdf3d6 0%,#e8d6a6 45%,rgba(232,214,166,0) 72%);opacity:.22}
.pw-forest{position:absolute;inset:0}
.pw-ray{position:absolute;left:430px;top:-40px;width:460px;height:860px;opacity:.5;mix-blend-mode:screen;
  background:linear-gradient(180deg,rgba(var(--rgb),.35) 0%,rgba(0,0,0,0) 85%);
  clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}

/* Bara api */
.ember{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a);
  animation:rise 7s linear infinite;opacity:0}
.ember:nth-child(3n){background:#ffd88a}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-520px);opacity:0}}

/* Nama gergasi di belakang */
.pw-watermark{position:absolute;left:0;right:420px;top:250px;text-align:center;font-family:'Cinzel Decorative',serif;
  font-weight:900;font-size:170px;letter-spacing:6px;color:transparent;-webkit-text-stroke:1.5px rgba(var(--rgb),.16);
  white-space:nowrap;pointer-events:none}

/* Bulatan rune */
.pw-rune-wrap{position:absolute;left:440px;top:655px;width:440px;height:130px;transform:perspective(500px) rotateX(62deg)}
.pw-rune{position:absolute;top:-155px;left:0;animation:spin 40s linear infinite;color:var(--a)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Slot wira — letak model 3D awak di sini */
#hero-model-slot{position:absolute;left:460px;top:150px;width:400px;height:600px;
  filter:drop-shadow(0 0 28px rgba(var(--rgb),.7));animation:bob 4.5s ease-in-out infinite;color:var(--a)}
#hero-model-slot canvas{width:100%!important;height:100%!important;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pw-fig{display:none;width:100%;height:100%}
.pw-fig.on{display:block;animation:figIn .5s ease}
@keyframes figIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}

/* Bar atas */
.pw-top{position:absolute;left:48px;right:48px;top:32px;display:flex;align-items:center;justify-content:space-between}
.pw-logo{display:flex;align-items:center;gap:12px;font-family:Cinzel,serif;font-weight:700;font-size:14px;letter-spacing:5px;color:#f5c76a}
.pw-title{text-align:center}
.pw-title h1{margin:0;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:44px;letter-spacing:8px;color:#fbe7b5;
  text-shadow:0 0 24px rgba(245,199,106,.55),0 2px 0 #6b4a12}
.pw-title div{font-size:15px;letter-spacing:3px;color:#a9b5ad;margin-top:2px}
.pw-music{display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;background:rgba(10,18,20,.7);
  border:1px solid rgba(245,199,106,.45);color:#f5c76a;font:700 15px Rajdhani;letter-spacing:2px;cursor:pointer}
.pw-music.off{opacity:.5}

/* Pemilih wira kiri */
.pw-list{position:absolute;left:48px;top:210px;width:250px;display:flex;flex-direction:column;gap:18px}
.pw-card{--c:#fff;--crgb:255,255,255;display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 18px;text-align:left;
  cursor:pointer;font-family:inherit;color:inherit;background:rgba(8,13,15,.75);border:1px solid rgba(255,255,255,.1);
  border-left:4px solid rgba(255,255,255,.15);transition:transform .25s,background .3s,border-color .3s,box-shadow .3s}
.pw-card:hover{transform:translateX(6px)}
.pw-card.on{transform:translateX(10px);border-color:var(--c);border-left-color:var(--c);
  background:linear-gradient(90deg,rgba(var(--crgb),.28),rgba(var(--crgb),.04));box-shadow:0 0 30px rgba(var(--crgb),.35)}
.pw-card .num{font-family:'Cinzel Decorative',serif;font-size:30px;font-weight:900;color:rgba(255,255,255,.25);width:44px;text-align:center}
.pw-card.on .num{color:var(--c)}
.pw-card .nm{font-family:Cinzel,serif;font-weight:900;font-size:20px;letter-spacing:2px;color:#f4efe2}
.pw-card .rg{font-size:14px;font-weight:600;letter-spacing:2px;color:var(--c)}
.pw-hint{margin-top:8px;font-size:14px;letter-spacing:2px;color:#7f8c86}

/* Panel maklumat kanan */
.pw-panel{position:absolute;right:48px;top:128px;width:420px;padding:28px 30px;
  background:linear-gradient(180deg,rgba(14,20,22,.92),rgba(6,9,11,.95));border:1px solid rgba(var(--rgb),.55);
  box-shadow:0 0 0 6px rgba(4,7,10,.6),0 0 60px rgba(var(--rgb),.18);
  clip-path:polygon(0 16px,16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px))}
.pw-panel.swap{animation:panelIn .45s ease}
@keyframes panelIn{from{opacity:.2;transform:translateX(16px)}to{opacity:1;transform:none}}
.pw-role{display:inline-block;padding:4px 12px;font-size:13px;font-weight:700;letter-spacing:3px;color:#0a0c0d;background:var(--a)}
.pw-name{margin:10px 0 6px;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:40px;letter-spacing:3px;color:#fbf3df;
  text-shadow:0 0 18px rgba(var(--rgb),.7)}
.pw-lore{margin:0 0 18px;font-size:16px;line-height:1.4;color:#b9c2bc}
.pw-stats{display:flex;flex-direction:column;gap:9px}
.pw-stat{display:flex;align-items:center;gap:12px}
.pw-stat .l{width:74px;font-size:14px;font-weight:700;letter-spacing:1.5px;color:#9aa69f}
.pw-stat .segs{flex:1;display:flex;gap:3px}
.pw-stat .segs span{flex:1;height:10px;transform:skewX(-20deg);background:rgba(255,255,255,.08)}
.pw-stat .segs span.f{background:var(--a);box-shadow:0 0 8px rgba(var(--rgb),.6)}
.pw-stat .v{width:32px;text-align:right;font-weight:700;font-size:16px;color:#f4efe2}
.pw-diff{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;letter-spacing:1.5px;color:#9aa69f}
.pw-diff .s{color:var(--a);font-size:16px;letter-spacing:3px}
.pw-diff .d{font-weight:700;color:#f4efe2}
.pw-sk-h{margin:20px 0 10px;font-family:Cinzel,serif;font-weight:700;font-size:14px;letter-spacing:4px;color:var(--a)}
.pw-skills{display:flex;flex-direction:column;gap:8px}
.pw-skill{display:flex;align-items:center;gap:14px;padding:9px 12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.pw-skill .k{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);
  border:2px solid var(--a);background:rgba(0,0,0,.4)}
.pw-skill .k b{transform:rotate(-45deg);font-family:Cinzel,serif;font-weight:900;font-size:16px;color:var(--a)}
.pw-skill .t{flex:1;min-width:0}
.pw-skill .t div:first-child{font-weight:700;font-size:17px;color:#f4efe2}
.pw-skill .t div:last-child{font-size:14px;color:#9aa69f}
.pw-skill .cd{font-weight:700;font-size:14px;color:var(--a)}
.pw-cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:20px;height:58px;border:0;cursor:pointer;
  font-family:Cinzel,serif;font-weight:900;font-size:19px;letter-spacing:4px;color:#1a1004;
  background:linear-gradient(180deg,#ffe29a,#e0a63a 55%,#b9781c);box-shadow:0 0 30px rgba(245,180,70,.45),inset 0 1px 0 #fff3c9;
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.pw-cta:hover{filter:brightness(1.15)}
.pw-tag{position:absolute;left:0;right:420px;bottom:34px;text-align:center;font-family:Cinzel,serif;font-size:15px;letter-spacing:6px;
  color:var(--a);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* Kilatan bila tekan MULA */
.pw-flash{position:absolute;inset:0;background:radial-gradient(circle at 46% 50%,#fff8e0,rgba(var(--rgb),.6) 40%,#000 80%);
  opacity:0;pointer-events:none}
.pw-flash.go{animation:flash 1s ease forwards}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:1;background:#000}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>

<script>
/* =========================================================
   DATA WIRA — ubah ikut game awak
   ========================================================= */
const WIRA = [
  { id:'pahlawan', name:'PAHLAWAN', range:'JARAK DEKAT', num:'I', color:'#ff9a3c', rgb:'255,154,60',
    role:'PEJUANG BARISAN DEPAN', stars:'★★★', diff:'Mudah', tagline:'PERISAI TERAKHIR HUTAN',
    lore:'Pendekar berpedang yang berdiri paling hadapan. Tetakannya membelah barisan musuh, tubuhnya menahan serangan paling berat.',
    stats:{NYAWA:100, SERANGAN:80, KELAJUAN:85, JARAK:18, KAWALAN:70},
    skills:[['1','Putaran Pedang','Tetak semua musuh di sekeliling','6s'],
            ['2','Laungan Perang','Pulih nyawa, serangan +50%','20s'],
            ['3','Hentakan Gempa','Hentak bumi, rosak besar & pengsankan musuh','28s']] },
  { id:'pemanah', name:'PEMANAH', range:'JARAK JAUH', num:'II', color:'#3fe08a', rgb:'63,224,138',
    role:'PENEMBAK TEPAT', stars:'★★', diff:'Sederhana', tagline:'MATA HELANG RIMBA',
    lore:'Pemburu senyap dari kanopi rimba. Anak panahnya tidak pernah tersasar, menjatuhkan musuh sebelum mereka sempat mendekat.',
    stats:{NYAWA:65, SERANGAN:90, KELAJUAN:95, JARAK:100, KAWALAN:55},
    skills:[['1','Panah Berganda','Lepaskan beberapa anak panah serentak','5s'],
            ['2','Langkah Angin','Lari pantas & elak serangan','16s'],
            ['3','Hujan Panah','Taburan panah ke kawasan sasaran','24s']] },
  { id:'ahlisihir', name:'AHLI SIHIR', range:'SIHIR KAWASAN', num:'III', color:'#9d7bff', rgb:'157,123,255',
    role:'PENGUASA UNSUR', stars:'★', diff:'Sukar', tagline:'SUARA ROH PURBA',
    lore:'Penjaga ilmu purba hutan. Mantera apinya membakar kawasan luas, namun tubuhnya rapuh jika musuh berjaya menghampiri.',
    stats:{NYAWA:55, SERANGAN:100, KELAJUAN:60, JARAK:80, KAWALAN:95},
    skills:[['1','Bola Api','Letupan api pada kawasan kecil','5s'],
            ['2','Perisai Sihir','Perisai menyerap kerosakan','20s'],
            ['3','Ribut Petir','Petir menyambar musuh sekeliling','26s']] }
];

(function(){
  const $ = id => document.getElementById(id);
  const root = $('pw');
  let sel = 0;
  const listeners = { select:[], start:[] };

  /* Skala pentas 1440x900 supaya muat semua saiz skrin */
  function fit(){
    const s = Math.min(innerWidth/1440, innerHeight/900);
    root.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* Bara api */
  const emb = $('pw-embers');
  for(let i=0;i<18;i++){
    const e = document.createElement('span');
    e.className='ember';
    e.style.left = (120 + (i*83)%1100)+'px';
    e.style.top = (560 + (i*37)%300)+'px';
    e.style.animationDelay = ((i*0.47)%7)+'s';
    e.style.animationDuration = (6 + i%4)+'s';
    emb.appendChild(e);
  }

  /* Kad pemilih */
  const list = $('pw-list');
  WIRA.forEach((w,i)=>{
    const b = document.createElement('button');
    b.className='pw-card';
    b.style.setProperty('--c', w.color);
    b.style.setProperty('--crgb', w.rgb);
    b.innerHTML = `<div class="num">${w.num}</div><div><div class="nm">${w.name}</div><div class="rg">${w.range}</div></div>`;
    b.addEventListener('click', ()=>select(i));
    list.appendChild(b);
  });
  const hint = document.createElement('div');
  hint.className='pw-hint'; hint.textContent='← → ATAU KLIK UNTUK TUKAR';
  list.appendChild(hint);

  function select(i){
    sel = (i + WIRA.length) % WIRA.length;
    const w = WIRA[sel];
    root.style.setProperty('--a', w.color);
    root.style.setProperty('--rgb', w.rgb);
    [...list.querySelectorAll('.pw-card')].forEach((c,j)=>c.classList.toggle('on', j===sel));
    document.querySelectorAll('.pw-fig').forEach(f=>f.classList.toggle('on', +f.dataset.hero===sel));

    $('pw-watermark').textContent = w.name;
    $('pw-role').textContent = w.role;
    $('pw-name').textContent = w.name;
    $('pw-lore').textContent = w.lore;
    $('pw-stars').textContent = w.stars;
    $('pw-diff').textContent = w.diff;
    $('pw-tag').textContent = `— ${w.tagline} —`;

    $('pw-stats').innerHTML = Object.entries(w.stats).map(([k,v])=>{
      const n = Math.round(v/10);
      const segs = Array.from({length:10},(_,j)=>`<span class="${j<n?'f':''}"></span>`).join('');
      return `<div class="pw-stat"><div class="l">${k}</div><div class="segs">${segs}</div><div class="v">${v}</div></div>`;
    }).join('');

    $('pw-skills').innerHTML = w.skills.map(([k,n,d,cd])=>
      `<div class="pw-skill"><div class="k"><b>${k}</b></div><div class="t"><div>${n}</div><div>${d}</div></div><div class="cd">⏱ ${cd}</div></div>`
    ).join('');

    const p = $('pw-panel'); p.classList.remove('swap'); void p.offsetWidth; p.classList.add('swap');
    listeners.select.forEach(fn=>fn(w, sel));
  }

  /* Papan kekunci */
  addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowUp') select(sel-1);
    if(e.key==='ArrowRight'||e.key==='ArrowDown') select(sel+1);
    if(e.key==='Enter') start();
  });

  /* Muzik (sambung ke audio awak sendiri) */
  $('pw-music').addEventListener('click', e=>{
    const b = e.currentTarget, on = b.getAttribute('aria-pressed')!=='true';
    b.setAttribute('aria-pressed', on); b.classList.toggle('off', !on);
    const a = document.querySelector('audio'); if(a){ on ? a.play() : a.pause(); }
  });

  function start(){
    $('pw-flash').classList.add('go');
    setTimeout(()=>listeners.start.forEach(fn=>fn(WIRA[sel], sel)), 700);
  }
  $('pw-start').addEventListener('click', start);

  /* ===== API untuk game.html =====
     PilihWira.onSelect((wira, index) => { ...tukar model 3D... })
     PilihWira.onStart((wira) => { ...mula game dengan wira.id... })
     PilihWira.useCanvas(renderer.domElement) → ganti siluet dengan canvas 3D */
  window.PilihWira = {
    data: WIRA,
    select, start,
    get current(){ return WIRA[sel]; },
    onSelect(fn){ listeners.select.push(fn); },
    onStart(fn){ listeners.start.push(fn); },
    useCanvas(canvas){
      document.querySelectorAll('.pw-fig').forEach(f=>f.remove());
      $('hero-model-slot').appendChild(canvas);
    },
    hide(){ $('pw-viewport').style.display='none'; }
  };

  /* Sambungan ke game.html: simpan wira pilihan, kemudian buka game */
  const KELAS = {pahlawan:'Warrior', pemanah:'Ranger', ahlisihir:'Wizard'};
  PilihWira.onStart(w => {
    try{ localStorage.setItem('lhb_class', KELAS[w.id]); }catch(e){}
    location.href = 'game.html';
  });

  /* Muzik skrin pilih (fail game sedia ada) — mula selepas klik pertama */
  const mus = new Audio('music/pilih.m4a'); mus.loop = true; mus.volume = .45;
  document.body.appendChild(mus);
  const kick = () => { if($('pw-music').getAttribute('aria-pressed')==='true') mus.play().catch(()=>{}); removeEventListener('pointerdown', kick); };
  addEventListener('pointerdown', kick);

  /* Mula dengan wira yang terakhir dipilih */
  let last = 0;
  try{ const c = localStorage.getItem('lhb_class'); const k = Object.keys(KELAS).find(id=>KELAS[id]===c); if(k) last = WIRA.findIndex(w=>w.id===k); }catch(e){}
  select(Math.max(0,last));
})();
</script>

<script type="module">
/* =========================================================
   MODEL 3D WIRA — guna model sama seperti dalam game (models/*.js)
   ========================================================= */
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const PW=window.PilihWira;if(!PW)throw 0;
const KELAS={pahlawan:'Warrior',pemanah:'Ranger',ahlisihir:'Wizard'};
const ANIM={Warrior:['Idle_Attacking','Sword_Attack'],Ranger:['Idle_Attacking','Bow_Shoot'],Wizard:['Idle_Attacking','Spell1']};
const PRESET={Warrior:['B_body','B_beard','C_ranger','G_ranger','G_bracer','L_ranger','F_ranger','S_pauldron','K_cape','W_sword','O_shield'],
 Ranger:['B_body','C_ranger','G_ranger','G_bracer','L_ranger','F_ranger','H_hood','S_pauldron','W_bow','W_bowback','O_dagger'],
 Wizard:['B_body','B_beard','C_peasant','G_peasant','G_bracer','L_peasant','F_peasant','H_hood','W_staff','K_cape','X_amulet']};
const slot=document.getElementById('hero-model-slot');
let R;try{R=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){throw e}
R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;R.setSize(400,600,false);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(28,400/600,.1,50);cam.position.set(0,1.55,7.4);cam.lookAt(0,1.35,0);
S.add(new THREE.HemisphereLight(0xfff0d8,0x1a1410,1.3));const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(-2.5,4,5);S.add(key);
const rim=new THREE.PointLight(0xff9a3c,35,12);rim.position.set(1.8,2.6,-2.2);S.add(rim);const rim2=new THREE.PointLight(0xff9a3c,14,10);rim2.position.set(-2.2,.6,-1.6);S.add(rim2);
const b64=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer};
const loadJS=src=>new Promise(r=>{const e=document.createElement('script');e.src=src;e.onload=()=>r(true);e.onerror=()=>r(false);document.head.appendChild(e)});
const KN=o=>{for(const n of[o&&o.name,o&&o.userData&&o.userData.name]){const q=n&&/^([A-Z]_[a-z]+)(_\d+)?$/.exec(n);if(q)return q[1]}return null};
const H={},clock=new THREE.Clock();let cur=null,shown=false;
async function get(k){if(H[k])return H[k];const job=(async()=>{
  if(!(window.LHB_MODELS&&window.LHB_MODELS[k]))await loadJS('models/'+k+'.js?v=33');const b=window.LHB_MODELS&&window.LHB_MODELS[k];if(!b)return null;
  const g=await new Promise((res,rej)=>new GLTFLoader().parse(b64(b),'',res,rej));delete window.LHB_MODELS[k];const m=g.scene;
  // sembunyi bahagian yang tidak dipakai (model kelengkapan modular)
  let kit=false;m.traverse(o=>{if(KN(o)==='B_body')kit=true});const P=new Set(PRESET[k]);
  m.traverse(o=>{if(!o.isMesh)return;o.frustumCulled=false;if(kit){let q=o,gn=null;while(q&&!(gn=KN(q)))q=q.parent;if(gn)o.visible=P.has(gn)}const mn=(o.material&&o.material.name)||'';if(mn.startsWith('BowBack_'))o.visible=false});
  const e=g.asset&&g.asset.extras,lo=e&&e.lo!=null?e.lo:0,hi=e&&e.hi!=null?e.hi:1.8,sc=2.75/((hi-lo)||1);m.scale.setScalar(sc);m.position.y=-lo*sc;
  const mix=new THREE.AnimationMixer(m),acts={};for(const c of g.animations)acts[c.name]=mix.clipAction(c);
  const h={k,m,mix,acts,cur:null};mix.addEventListener('finished',()=>play(h,ANIM[k][0]));return h})();H[k]=job;return job}
function play(h,n,once){const a=h.acts[n]||h.acts.Idle_Weapon||h.acts.Idle;if(!a)return;a.reset();a.setLoop(once?THREE.LoopOnce:THREE.LoopRepeat,Infinity);a.clampWhenFinished=!!once;a.play();if(h.cur&&h.cur!==a)a.crossFadeFrom(h.cur,.25,false);h.cur=a}
let want=null;
async function show(w){const k=KELAS[w.id];want=k;rim.color.set(w.color);rim2.color.set(w.color);const h=await get(k);if(!h||want!==k)return;
  if(cur&&cur!==h)S.remove(cur.m);S.add(h.m);h.m.rotation.y=-.35;play(h,ANIM[k][1],true);cur=h;
  if(!shown){shown=true;PW.useCanvas(R.domElement)}
  for(const o of Object.values(KELAS))if(o!==k)get(o)}
PW.onSelect(w=>show(w));show(PW.current);
let drag=null,rot=0;R.domElement.style.cursor='grab';R.domElement.style.pointerEvents='auto';slot.style.pointerEvents='auto';
R.domElement.addEventListener('pointerdown',e=>{drag=e.clientX;R.domElement.setPointerCapture(e.pointerId)});R.domElement.addEventListener('pointermove',e=>{if(drag!=null){rot+=(e.clientX-drag)*.012;drag=e.clientX}});['pointerup','pointercancel'].forEach(v=>R.domElement.addEventListener(v,()=>drag=null));
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(cur){cur.mix.update(dt);cur.m.rotation.y=-.35+rot+Math.sin(clock.elapsedTime*.45)*.35}R.render(S,cam)})();
</script>
