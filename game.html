<style>

</style></head><body>
<div id="game"></div>
<div id="top"><div class="panel"><div class="brand">LEGENDA HUTAN BELANTARA</div><div class="sub">OPEN WORLD RPG • PROTOTAIP 0.1</div></div><div class="panel stats"><div>NYAWA WIRA</div><div class="hp"><i></i></div><div id="coord">Kawasan: Hutan Permulaan</div></div></div>

<div id="bottom"><div class="help"><b>KAWALAN</b><br>WASD / Anak panah: bergerak<br>Shift: berlari • Seret skrin: kamera</div><div class="controls mobile-only"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="act" id="sprint">LARI<br>⚡</button></div></div><div id="toast">SELAMAT DATANG, WIRA</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b8a0);scene.fog=new THREE.FogExp2(0x91b8a0,.0065);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf1ff,0x34442b,2.0));const sun=new THREE.DirectionalLight(0xffe0a6,2.5);sun.position.set(-55,95,45);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});

// Soft rolling terrain patches and a winding dirt trail.
for(let i=0;i<38;i++){let x=(Math.random()-.5)*240,z=(Math.random()-.5)*240;if(Math.abs(x)<12&&Math.abs(z)<28)continue;let m=new THREE.Mesh(new THREE.CircleGeometry(4+Math.random()*12,9),mat([0x607747,0x49633b,0x71824a][i%3]));m.rotation.x=-Math.PI/2;m.position.set(x,.025,z);m.scale.y=.55;scene.add(m)}
const pathPts=[];for(let i=0;i<15;i++)pathPts.push(new THREE.Vector3(Math.sin(i*.45)*7,.035,-i*10));const curve=new THREE.CatmullRomCurve3(pathPts);const path=new THREE.Mesh(new THREE.TubeGeometry(curve,180,2.8,8,false),mat(0x9a8155));path.position.y=.01;scene.add(path);
// distant forest silhouettes
for(let i=0;i<100;i++){const a=i/100*Math.PI*2,r=115+Math.random()*65,x=Math.cos(a)*r,z=Math.sin(a)*r;const h=16+Math.random()*25;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.7,1.1,h*.42,7),mat(0x59432c));trunk.position.set(x,h*.21,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(7+Math.random()*5,h*.75,7),mat(0x254c32));crown.position.set(x,h*.72,z);scene.add(crown)}
// detailed clustered trees around the playable woodland
const trees=[];function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.38,.65,5.5,9),mat(0x63452d));trunk.position.y=2.75;trunk.castShadow=true;g.add(trunk);for(let j=0;j<3;j++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(2.7-j*.28,1),mat([0x315e39,0x3b7041,0x477b45][j]));crown.position.set((j-1)*.7,5.3+j*1.15,((j%2)*.7)-.3);crown.scale.set(1.05,.95,1);crown.castShadow=true;g.add(crown)}scene.add(g);trees.push({x,z,r:1.5*s})}
for(let i=0;i<175;i++){let x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;if(Math.abs(x)<9&&z<8&&z>-48)continue;tree(x,z,.65+Math.random()*.85)}
// rocks, ferns and grass tufts
for(let i=0;i<100;i++){let x=(Math.random()-.5)*170,z=(Math.random()-.5)*170;if(Math.abs(x)<8&&Math.abs(z)<12)continue;let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.5+Math.random()*1.2,0),mat(0x777b70));rock.position.set(x,.45,z);rock.scale.y=.55;rock.rotation.set(Math.random(),Math.random(),Math.random());rock.castShadow=true;rock.receiveShadow=true;scene.add(rock)}
const grassMat=[mat(0x77904b),mat(0x8b9b56),mat(0x526f3d)];for(let i=0;i<900;i++){let x=(Math.random()-.5)*170,z=(Math.random()-.5)*170;if(Math.abs(x)<7&&Math.abs(z)<10)continue;const h=.25+Math.random()*.65;const blade=new THREE.Mesh(new THREE.ConeGeometry(.12,h,4),grassMat[i%3]);blade.position.set(x,h/2,z);blade.rotation.z=(Math.random()-.5)*.45;scene.add(blade)}
// hero: articulated low-poly adventurer with visible arms, legs and sword
const hero=new THREE.Group();scene.add(hero);const skin=mat(0xd5a276),armor=mat(0x344e46),cloth=mat(0x8c3428),gold=mat(0xd5a64e),steel=mat(0xb9c7c4,.35),dark=mat(0x292b2a);
function mesh(parent,geo,ma,pos){const o=new THREE.Mesh(geo,ma);o.position.set(...pos);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
mesh(hero,new THREE.CylinderGeometry(.42,.55,1.15,8),armor,[0,1.65,0]);mesh(hero,new THREE.SphereGeometry(.48,10,8),cloth,[0,1.48,.02]);mesh(hero,new THREE.SphereGeometry(.34,12,10),skin,[0,2.48,0]);const helm=mesh(hero,new THREE.ConeGeometry(.43,.58,8),gold,[0,2.91,0]);helm.rotation.z=.08;mesh(hero,new THREE.BoxGeometry(.52,.12,.16),dark,[0,2.47,.28]);
const limbs=[];for(const side of [-1,1]){const arm=new THREE.Group();arm.position.set(side*.53,2.05,0);hero.add(arm);mesh(arm,new THREE.CylinderGeometry(.16,.19,.78,7),armor,[0,-.35,0]);mesh(arm,new THREE.SphereGeometry(.16,8,7),skin,[0,-.76,.02]);limbs.push(arm);const leg=new THREE.Group();leg.position.set(side*.24,1.12,0);hero.add(leg);mesh(leg,new THREE.CylinderGeometry(.19,.22,.72,7),dark,[0,-.35,0]);mesh(leg,new THREE.BoxGeometry(.3,.18,.48),dark,[0,-.72,.12]);limbs.push(leg)}
// right hand sword, aligned in the grip
const sword=new THREE.Group();sword.position.set(0,-.75,.04);limbs[2].add(sword);mesh(sword,new THREE.BoxGeometry(.12,.18,.13),gold,[0,0,0]);const blade=mesh(sword,new THREE.BoxGeometry(.12,1.12,.055),steel,[0,.65,.02]);blade.rotation.z=-.06;const tip=mesh(sword,new THREE.ConeGeometry(.085,.24,4),steel,[0,1.32,.02]);tip.rotation.z=Math.PI;
// glowing campfire landmark ahead
const fire=new THREE.Group();fire.position.set(1.5,0,-75);scene.add(fire);const stones=mat(0x77736a);for(let i=0;i<9;i++){let a=i/9*Math.PI*2;let b=mesh(fire,new THREE.DodecahedronGeometry(.55,0),stones,[Math.cos(a)*1.5,.35,Math.sin(a)*1.5]);b.scale.set(1,.65,.9)}const logs=mesh(fire,new THREE.CylinderGeometry(.2,.2,3,7),mat(0x493021),[0,.42,0]);logs.rotation.z=Math.PI/2;const flame=new THREE.PointLight(0xff9a35,3,24);flame.position.y=2;fire.add(flame);const fireMesh=mesh(fire,new THREE.ConeGeometry(.7,2.2,7),mat(0xff8a27),[0,1.5,0]);
for(let i=0;i<6;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(.11,6,6),mat(0xffc66c));p.position.set((Math.random()-.5)*.7,2.5+Math.random()*2,(Math.random()-.5)*.7);fire.add(p)}
// subtle floating pollen particles
const dustGeo=new THREE.BufferGeometry(),dust=[];for(let i=0;i<240;i++)dust.push((Math.random()-.5)*120,Math.random()*18-1,(Math.random()-.5)*120);dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dust,3));const dustPts=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xd8e9a0,size:.16,transparent:true,opacity:.48}));scene.add(dustPts);
let yaw=0,camYaw=0,moveX=0,moveZ=0,sprinting=false,moving=false,walk=0;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let stickId=null;function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.min(34,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);moveX=Math.cos(a)*d/34;moveZ=Math.sin(a)*d/34;knob.style.transform=`translate(${moveX*34}px,${moveZ*34}px)`}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});function resetStick(){stickId=null;moveX=moveZ=0;knob.style.transform=''}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);const sprintBtn=document.querySelector('#sprint');sprintBtn.addEventListener('pointerdown',()=>sprinting=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>sprintBtn.addEventListener(ev,()=>sprinting=false));
// drag-to-look camera for touch and mouse
let dragging=false,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientY>innerHeight-145)return;dragging=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(dragging){camYaw-=(e.clientX-lastX)*.006;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
const clock=new THREE.Clock();const toast=document.querySelector('#toast');toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,2600);let found=false;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+moveX;let iz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+moveZ;let len=Math.hypot(ix,iz);moving=len>.12;if(len>1){ix/=len;iz/=len}const run=sprinting||keys.shift;const speed=run?12:7.2;if(moving){const angle=Math.atan2(ix,iz);yaw=angle+camYaw;hero.rotation.y=yaw;hero.position.x+=Math.sin(yaw)*speed*dt;hero.position.z+=Math.cos(yaw)*speed*dt;walk+=dt*(run?13:8)}else walk+=dt*2;
const swing=moving?Math.sin(walk)*.62:Math.sin(t*1.5)*.035;limbs[0].rotation.x=swing;limbs[2].rotation.x=-swing;limbs[3].rotation.x=-swing;limbs[1].rotation.x=moving?-.25+Math.sin(walk+Math.PI)*.3:-.18;hero.position.y=moving?Math.abs(Math.sin(walk*2))*.045:0;
// gentle collision radius around tree trunks
for(const tr of trees){const dx=hero.position.x-tr.x,dz=hero.position.z-tr.z,d=Math.hypot(dx,dz),min=tr.r+.55;if(d<min&&d>.001){hero.position.x=tr.x+dx/d*min;hero.position.z=tr.z+dz/d*min}}
const desiredYaw=camYaw;const behind=new THREE.Vector3(Math.sin(desiredYaw)*10,6.1,Math.cos(desiredYaw)*10);const target=new THREE.Vector3(hero.position.x,2.1,hero.position.z);const camPos=target.clone().add(behind);camera.position.lerp(camPos,.09);camera.lookAt(target.x,target.y+.25,target.z-1.5);
fireMesh.scale.y=1+Math.sin(t*9)*.12;flame.intensity=2.5+Math.sin(t*13)*.7;dustPts.rotation.y=t*.012;
const dFire=hero.position.distanceTo(fire.position);if(dFire<9&&!found){found=true;toast.textContent='UNGUN API DITEMUIKAN!\nPERMULAAN PENGEMBARAAN';toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,2800)}
renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script></body></html>
