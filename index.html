<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lagenda Hutan Belantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1810;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:'Nunito',system-ui,sans-serif;color:#f6ecd6}
canvas{display:block}
#c{position:fixed;inset:0;touch-action:none}
.panel{background:linear-gradient(180deg,rgba(38,26,14,.86),rgba(22,15,8,.86));border:1.5px solid rgba(232,194,90,.55);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,230,160,.15)}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
#stats{padding:8px 10px;width:178px;pointer-events:auto;cursor:pointer}
#stats .nm{font-family:'Cinzel',serif;font-size:13px;color:#f3d27a;display:flex;justify-content:space-between;margin-bottom:4px}
#stats .nm span{font-family:'Nunito';font-size:11px;color:#e9dcc0}
#stats .mini{font-size:11px;margin-top:5px;display:flex;justify-content:space-between;color:#e9dcc0}
.bar{position:relative;height:12px;border-radius:7px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:4px;border:1px solid rgba(255,255,255,.1)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .15s}
.bar.hp i{background:linear-gradient(180deg,#ff7a6b,#c62b3a)}
.bar.xp{height:7px}
.bar.xp i{background:linear-gradient(180deg,#9fe0ff,#3a8fd6)}
.bar b{position:absolute;inset:0;font-size:9px;line-height:11px;text-align:center;font-weight:800;text-shadow:0 1px 2px #000}
#quest{padding:7px 11px;max-width:52%;font-size:12px;line-height:1.35}
#quest .t{font-family:'Cinzel',serif;color:#f3d27a;font-size:10.5px;letter-spacing:.3px;margin-bottom:2px}
#side{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(108px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:9px;z-index:6}
#side button{width:48px;height:48px;border-radius:50%;border:none;font-size:22px;cursor:pointer;padding:0;position:relative;background:radial-gradient(circle at 35% 30%,#ffe7a3,#b98a2c 60%,#5e3f0c);box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35)}
#side .dot{position:absolute;right:-2px;top:-2px;width:13px;height:13px;border-radius:50%;background:#ff3d6e;border:2px solid #fff;display:none}
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.08),rgba(255,240,200,.18));border:2px solid rgba(243,210,122,.45);z-index:6;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c9,#d9a93f 60%,#8a6418);box-shadow:0 3px 10px rgba(0,0,0,.5);pointer-events:none}
#btns{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:180px;height:180px;z-index:6;pointer-events:none}
#btns button{position:absolute;border:none;border-radius:50%;color:#fff;touch-action:none;cursor:pointer;padding:0;pointer-events:auto;box-shadow:0 5px 14px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35)}
#btns button:active{transform:scale(.93)}
#atk{right:0;bottom:0;width:84px;height:84px;font-size:32px;background:radial-gradient(circle at 35% 30%,#ff8f7a,#c32f3c 60%,#7a1420)}
.sk{width:58px;height:58px;font-size:24px;background:radial-gradient(circle at 35% 30%,#ffd6ff,#b04bd6 60%,#4e1470)}
#s1{right:92px;bottom:2px}#s2{right:78px;bottom:70px}#s3{right:10px;bottom:94px}
.sk.cd{filter:grayscale(.8) brightness(.65)}
.sk b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;text-shadow:0 2px 3px #000}
#ctx{position:fixed;left:calc(152px + env(safe-area-inset-left));bottom:calc(40px + env(safe-area-inset-bottom));border:none;border-radius:50%;color:#fff;z-index:6;touch-action:none;cursor:pointer;padding:0;box-shadow:0 5px 14px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35);width:60px;height:60px;font-size:26px;background:radial-gradient(circle at 35% 30%,#a8e3ff,#2f86c9 60%,#164a7a);visibility:hidden;animation:pulse 1.2s infinite}
#pdot{position:absolute;right:-4px;top:-4px;min-width:19px;height:19px;border-radius:10px;background:#2fbf5f;border:2px solid #fff;color:#fff;font:900 10px/15px Nunito;display:none;padding:0 3px}
.inp{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid rgba(243,210,122,.5);background:rgba(0,0,0,.4);color:#fff;font:800 15px Nunito;outline:none}
#ctx.show{visibility:visible}
#ctx.bite{background:radial-gradient(circle at 35% 30%,#fff3a8,#ffb92b 60%,#b05a00);animation:pulse .3s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(580px,calc(var(--rw)*.94));padding:14px 16px 26px;z-index:20;display:none;cursor:pointer}
#dlg.show{display:block}
#dlg .who{font-family:'Cinzel',serif;color:#f3d27a;font-size:15px;margin-bottom:6px}
#dlg .txt{font-size:16px;line-height:1.45;min-height:46px}
#dlg .nx{position:absolute;right:14px;bottom:7px;font-size:11px;color:#e8c25a;animation:pulse 1s infinite}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.8);text-align:center;z-index:15;opacity:0;transition:all .45s;pointer-events:none;padding:14px 24px;width:max-content;max-width:calc(var(--rw)*.88)}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner h2{margin:0;font-family:'Cinzel',serif;font-weight:900;font-size:24px;color:#ffd979;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px currentColor}
#banner p{margin:6px 0 0;font-size:14px}
.screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 35%,rgba(40,70,40,.6),rgba(5,10,6,.95) 75%);overflow-y:auto}
#title h1{margin:0;font-family:'Cinzel',serif;font-weight:900;font-size:clamp(32px,calc(var(--rw)*.09),58px);line-height:1.05;color:#ffd979;text-shadow:0 3px 0 #6b3d0e,0 0 30px rgba(255,200,90,.45)}
.sub{margin:10px 0 18px;color:#cfe8c0;font-size:14px;letter-spacing:1px}
.how{font-size:13px;line-height:1.65;color:#e9dcc0;max-width:360px;padding:12px 16px;margin-bottom:18px;text-align:left}
.tbtn{font-family:'Cinzel',serif;font-weight:900;font-size:19px;padding:13px 36px;border-radius:40px;border:2px solid #ffe7a3;color:#3a2006;background:linear-gradient(180deg,#ffe28a,#d99a2b);box-shadow:0 6px 20px rgba(217,154,43,.5);cursor:pointer;margin:5px}
.tbtn.alt{font-size:13px;padding:9px 20px;background:rgba(255,255,255,.1);color:#f3d27a;box-shadow:none;border-color:rgba(243,210,122,.5)}
#create{display:none;justify-content:flex-start;padding-top:calc(20px + env(safe-area-inset-top));background:radial-gradient(ellipse at 50% 30%,#23401f,#070d08 75%)}
#create h2{font-family:'Cinzel',serif;color:#ffd979;margin:4px 0 6px;font-size:24px}
#pv{width:170px;height:170px;margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(420px,100%);margin:6px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:min(300px,100%);margin:4px 0 14px}
.opt{border:2px solid rgba(243,210,122,.3);background:rgba(0,0,0,.35);border-radius:12px;padding:9px 5px;color:#f6ecd6;cursor:pointer;font-family:'Nunito';font-weight:800;font-size:13px}
.opt .i{font-size:26px;display:block}
.opt small{display:block;font-weight:600;font-size:10.5px;opacity:.8;margin-top:3px;line-height:1.25}
.opt.on{border-color:#ffd979;background:rgba(243,210,122,.2);box-shadow:0 0 14px rgba(255,217,121,.35)}
#skdesc{font-size:12.5px;max-width:380px;color:#e9dcc0;margin-bottom:8px;min-height:34px}
#modal{position:fixed;inset:0;z-index:25;background:rgba(5,8,5,.6);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#mbox{width:min(560px,var(--rw));max-height:calc(var(--rh)*.88);overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));touch-action:pan-y}
#mbox h3{font-family:'Cinzel',serif;color:#f3d27a;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.x{background:none;border:none;color:#f3d27a;font-size:24px;cursor:pointer;padding:0 4px}
.sec{font-family:'Cinzel',serif;color:#f3d27a;font-size:12px;letter-spacing:1px;margin:14px 0 7px}
.eqg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{border:2px solid #444;border-radius:10px;padding:8px 4px;text-align:center;background:rgba(0,0,0,.3);font-size:22px;cursor:pointer}
.slot small{display:block;font-size:10px;line-height:1.2;margin-top:3px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:4px 9px;font-size:12.5px;font-weight:800}
.chip.no{border-color:#ff6b6b;color:#ffb3b3}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(0,0,0,.3);border-left:4px solid;margin-bottom:6px}
.item .ic{font-size:24px;min-width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.item .inf{flex:1;font-size:12px;line-height:1.35}
.item .nm{font-weight:800;font-size:14px}
.up{color:#7dff9a}.dn{color:#ff8a8a}
.btn{border:none;border-radius:8px;padding:8px 11px;font-weight:800;font-family:'Nunito';font-size:13px;cursor:pointer}
.btn.g{background:linear-gradient(#ffe28a,#d99a2b);color:#3a2006}
.btn.d{background:rgba(255,255,255,.12);color:#eee}
.btn:disabled{opacity:.38}
.big{width:100%;padding:12px;font-size:15px;margin-top:9px}
.sel{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.sel button{font-size:21px;padding:8px 0;border-radius:9px;border:2px solid transparent;background:rgba(0,0,0,.35);cursor:pointer}
.sel button.on{border-color:#f3d27a;background:rgba(243,210,122,.18)}
.note{font-size:12.5px;line-height:1.45;color:#e9dcc0}
.empty{font-size:12.5px;opacity:.7;padding:6px 2px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;background:rgba(0,0,0,.3);margin-bottom:6px;border:1px solid rgba(255,255,255,.08)}
.mrow.cur{border-color:#ffd979;background:rgba(243,210,122,.12)}
.mrow .mi{font-size:26px;width:36px;text-align:center}
.mrow .mt{flex:1;font-size:12px;line-height:1.35}
.mrow .mt b{font-size:14px}
#modal{z-index:40}
#modal.light{background:rgba(5,8,5,.12);align-items:flex-start}
#modal.light #mbox{border-radius:0 0 16px 16px;max-height:calc(var(--rh)*.64);padding-top:calc(14px + env(safe-area-inset-top))}
body:not(.ingame):not(.pv) #hud,body:not(.ingame) #side,body:not(.ingame):not(.pv) #joy,body:not(.ingame):not(.pv) #btns,body:not(.ingame) #ctx{display:none!important}
body.pv #hud{display:none!important}
#btns.mir #atk{right:auto;left:0}#btns.mir #s1{right:auto;left:92px}#btns.mir #s2{right:auto;left:78px}#btns.mir #s3{right:auto;left:10px}
#menu{justify-content:space-between;background:linear-gradient(180deg,rgba(4,10,6,.1),rgba(4,10,6,.3) 42%,rgba(3,6,4,.94) 86%);padding:calc(30px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.emb{width:94px;height:94px;margin:0 auto 2px;display:block;filter:drop-shadow(0 0 18px rgba(255,200,90,.55));animation:flt 4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-7px)}}
.kick{font:700 14px Cinzel,serif;letter-spacing:.75em;color:#f3dca0;margin:4px 0 0 .75em;text-shadow:0 2px 8px rgba(0,0,0,.9)}
#menu h1{margin:2px 0 0;font-family:Cinzel,serif;font-weight:900;font-size:clamp(42px,calc(var(--rw)*.12),78px);line-height:.96;letter-spacing:.02em;background:linear-gradient(180deg,#fff8d8 0%,#ffe08a 38%,#e0a030 70%,#8a5410 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2006) drop-shadow(0 0 26px rgba(255,190,80,.5))}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:#f0d38a;font:800 11px Nunito;letter-spacing:.2em;white-space:nowrap;margin:12px 0 0;text-transform:uppercase;text-shadow:0 2px 6px #000}
.orn:before,.orn:after{content:'';height:1.5px;width:52px;background:linear-gradient(90deg,transparent,#e8c25a)}.orn:after{transform:scaleX(-1)}
.mb{display:block;width:min(330px,calc(var(--rw)*.88));margin:9px auto;padding:13px 14px;border-radius:14px;font:900 17px Cinzel,serif;letter-spacing:.04em;border:1.5px solid rgba(255,220,140,.65);background:linear-gradient(180deg,rgba(62,42,16,.93),rgba(24,15,6,.95));color:#ffe7a3;box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,230,160,.25);cursor:pointer}
.mb.pri{background:linear-gradient(180deg,#ffe9a0,#e0a535 55%,#b0741a);color:#2e1800;border-color:#fff1c0;box-shadow:0 6px 24px rgba(224,165,53,.5),inset 0 1px 0 rgba(255,255,255,.6);animation:pulse 2.2s infinite}
.mb small{display:block;font:800 11.5px Nunito;letter-spacing:0;opacity:.8;margin-top:3px}
.mrow2{display:flex;gap:10px;justify-content:center;width:min(330px,calc(var(--rw)*.88));margin:0 auto}.mrow2 .mb{margin:4px 0;font-size:13.5px;padding:11px 6px}
.langsw{display:inline-flex;border:1.5px solid rgba(243,210,122,.5);border-radius:20px;overflow:hidden;margin-top:12px}.langsw button{border:none;background:rgba(0,0,0,.45);color:#e9dcc0;font:800 12px Nunito;padding:7px 12px;cursor:pointer}.langsw button.on{background:#e0a535;color:#2e1800}
.ver{font-size:10.5px;opacity:.55;margin-top:8px}
#toast{position:fixed;left:50%;top:calc(98px + env(safe-area-inset-top));transform:translateX(-50%);z-index:16;padding:8px 14px;max-width:calc(var(--rw)*.72);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#chatlist{max-height:190px;overflow-y:auto;background:rgba(0,0,0,.3);border-radius:10px;padding:8px;font-size:13px;line-height:1.45;margin-bottom:8px;user-select:text;-webkit-user-select:text}
#chatlist .cm b{color:#9ff3ff}#chatlist .cm.me b{color:#ffd979}
.chatrow{display:flex;gap:6px}.chatrow .inp{flex:1}
input[type=range]{flex:1;accent-color:#e0a535;touch-action:none;height:26px}
.setrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.setrow span{min-width:118px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
#cdot{position:absolute;left:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:#ff3d6e;border:2px solid #fff;display:none}
#create .tbtn.alt{margin-top:6px}
.help li{margin:5px 0;font-size:13px;line-height:1.45}

:root{--rw:100vw;--rh:100vh}
#root{position:fixed;inset:0;overflow:hidden}
#sidetog{position:fixed;right:0;top:calc(108px + env(safe-area-inset-top));width:30px;height:54px;border-radius:14px 0 0 14px;background:linear-gradient(180deg,rgba(62,42,16,.94),rgba(24,15,6,.95));border:1.5px solid rgba(255,220,140,.6);border-right:none;color:#ffe7a3;font:900 26px/1 Nunito;z-index:7;cursor:pointer;padding:0 0 4px;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.45)}
#tdot{position:absolute;left:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:#ff3d6e;border:2px solid #fff;display:none}
#side{right:calc(40px + env(safe-area-inset-right))!important;transition:transform .25s,opacity .25s}
#side:not(.open){transform:translateX(150%);opacity:0;pointer-events:none}
body:not(.ingame) #sidetog{display:none!important}
.land #side{flex-direction:row;top:calc(98px + env(safe-area-inset-top))}
.land #sidetog{top:calc(96px + env(safe-area-inset-top))}
.land #menu{flex-direction:row;justify-content:space-evenly;align-items:center;padding:14px 20px}
.land #menu h1{font-size:calc(var(--rh)*.15)}
.land .emb{width:70px;height:70px}
.land #mbtns .mb,.land .mrow2{width:min(330px,calc(var(--rw)*.42))}
.land #create{padding-top:12px}
.land #pv{width:120px;height:120px}
.land .grid3{width:min(560px,calc(var(--rw)*.9))}
.land #banner{top:26%}

#acttog{position:fixed;left:0;top:calc(114px + env(safe-area-inset-top));width:30px;height:54px;border-radius:0 14px 14px 0;background:linear-gradient(180deg,rgba(62,42,16,.94),rgba(24,15,6,.95));border:1.5px solid rgba(255,220,140,.6);border-left:none;color:#ffe7a3;font:900 26px/1 Nunito;z-index:7;cursor:pointer;padding:0 0 4px;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.45)}
#act{position:fixed;left:calc(40px + env(safe-area-inset-left));top:calc(114px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:9px;z-index:6;transition:transform .25s,opacity .25s}
#act:not(.open){transform:translateX(-150%);opacity:0;pointer-events:none}
#act button{width:48px;height:48px;border-radius:50%;border:none;font-size:22px;cursor:pointer;padding:0;position:relative;background:radial-gradient(circle at 35% 30%,#b9f5d0,#3fa36b 60%,#16502e);box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35);touch-action:none}
#act button.on{box-shadow:0 0 0 3px #ffd979,0 4px 12px rgba(0,0,0,.5)}
#act button small{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);font:800 8.5px Nunito;color:#fff;background:rgba(0,0,0,.65);padding:1px 4px;border-radius:6px;white-space:nowrap}
body:not(.ingame) #act,body:not(.ingame) #acttog{display:none!important}
.land #act{flex-direction:row;top:calc(110px + env(safe-area-inset-top))}
.land #acttog{top:calc(108px + env(safe-area-inset-top))}
.fxb{--c1:#4a3512;--c2:#120c04;--gl:rgba(255,200,90,.55);color:#ffe9a8!important;display:flex!important;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 26%,rgba(255,255,255,.24),rgba(255,255,255,0) 46%),radial-gradient(circle at 50% 62%,var(--c1),var(--c2) 74%)!important;
  box-shadow:0 0 0 1.5px rgba(255,228,150,.95),0 0 0 4px rgba(16,10,3,.9),0 0 0 5.5px rgba(255,200,90,.5),0 0 18px var(--gl),inset 0 -7px 12px rgba(0,0,0,.55)!important}
.fxb .ic{width:52%;height:52%;filter:drop-shadow(0 0 4px var(--gl)) drop-shadow(0 0 1px rgba(255,255,255,.6));pointer-events:none}
.fxb::before{content:'';position:absolute;inset:4px;border-radius:50%;border:1px dashed rgba(255,228,150,.35);animation:spinr 14s linear infinite;pointer-events:none}
@keyframes spinr{to{transform:rotate(360deg)}}
.fxb.red{--c1:#a3202e;--c2:#1e0306;--gl:rgba(255,90,80,.6);color:#ffe0d8!important}
.fxb.vio{--c1:#6a1f96;--c2:#14031f;--gl:rgba(205,130,255,.6);color:#f6e2ff!important}
.fxb.blue{--c1:#1f6aa8;--c2:#04121f;--gl:rgba(110,200,255,.6);color:#e2f4ff!important}
.fxb.teal{--c1:#1f8a5a;--c2:#03160d;--gl:rgba(110,255,180,.55);color:#e2fff0!important}
#ctx.bite{--c1:#d98a10;--c2:#2a1400;--gl:rgba(255,200,60,.8)}

<script>/* ===== Standalone multiplayer/ranking via Firebase Realtime Database ===== */
(function(){
  const FB_URL_BUILTIN='https://lagenda-hutan-belantara-default-rtdb.asia-southeast1.firebasedatabase.app';
  try{const q=new URLSearchParams(location.search).get('db');if(q&&/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)\/?$/i.test(q))localStorage.setItem('lhb_fburl',q.replace(/\/$/,''))}catch(e){}
  const url=()=>{try{return FB_URL_BUILTIN||localStorage.getItem('lhb_fburl')||''}catch(e){return FB_URL_BUILTIN}};
  window.LHB_FB={url,set(u){try{localStorage.setItem('lhb_fburl',u)}catch(e){}},clear(){try{localStorage.removeItem('lhb_fburl')}catch(e){}},builtin:!!FB_URL_BUILTIN};
  let myId;try{myId=localStorage.getItem('lhb_uid');if(!myId){myId='u'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);localStorage.setItem('lhb_uid',myId)}}catch(e){myId='u'+Math.random().toString(36).slice(2,12)}
  const pid=myId+'_'+Math.random().toString(36).slice(2,6);
  let dbp=null;
  function getDB(){if(dbp)return dbp;dbp=new Promise(res=>{const u=url();if(!u||!window.firebase)return res(null);
      try{const app=firebase.initializeApp({databaseURL:u});res(app.database())}catch(e){console.error(e);res(null)}});return dbp}
  const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>v===undefined?null:v));
  function makeRoom(db){const ref=db.ref('lhb/peers'),me=ref.child(pid);me.onDisconnect().remove();
    let last=0,pending=null,tm=null,prev=new Set();
    const flush=()=>{tm=null;if(!pending)return;const v=pending;pending=null;last=Date.now();me.set({p:v.p===null?null:clean(v.p),t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{})};
    return{presence(v){pending=v;if(v&&v.p===null){flush();return Promise.resolve()}const w=Math.max(0,180-(Date.now()-last));if(!tm)tm=setTimeout(flush,w);return Promise.resolve()},
      onPeers(cb,err){ref.on('value',sn=>{const now=Date.now(),val=sn.val()||{},peers=[],cur=new Set();
          for(const k in val){const d=val[k];if(!d||(d.t&&now-d.t>120000&&k!==pid))continue;cur.add(k);peers.push({peer:k,isMe:k===pid,sameTab:k===pid,kind:'viewer',guest:false,presence:d.p?{p:d.p}:{}})}
          const left=[...prev].filter(k=>!cur.has(k)).map(k=>({peer:k}));prev=cur;cb({peers,left})},e=>{console.error(e);err&&err(e)});
        setInterval(()=>{if(!pending&&!tm)me.child('t').set(firebase.database.ServerValue.TIMESTAMP).catch(()=>{})},30000)}}}
  function makeDB(db){return{
    collection(name){const base=db.ref('lhb/'+name);let ord='s',lim=50;const q={orderBy(f){ord=f;return q},limit(n){lim=n;return q},
        onSnapshot(cb,err){base.orderByChild(ord).limitToLast(lim).on('value',sn=>{const docs=[];sn.forEach(c=>{docs.push({id:c.key,data:()=>c.val()})});docs.reverse();cb({docs})},e=>err&&err(e))}};return q},
    doc(path){const r=db.ref('lhb/'+path);return{set(v){return r.set(clean(v))}}}}}

})();

function sprite(w,h,ox,oy,fn){const S=2,cv=document.createElement('canvas');cv.width=w*S;cv.height=h*S;const c=cv.getContext('2d');c.scale(S,S);c.translate(ox,oy);fn(c);return cv}
function makeTree(c1,c2,c3,sv,trunk){return sprite(120,140,60,130,c=>{
  const t=trunk||['#4a2e19','#6e4728','#3d2414'];const tg=c.createLinearGradient(-6,0,6,0);tg.addColorStop(0,t[0]);tg.addColorStop(.5,t[1]);tg.addColorStop(1,t[2]);
  c.fillStyle=tg;rr(c,-6,-38,12,40,4);c.fill();

  let s2=sv||99;const q=()=>{s2=(s2*16807)%2147483647;return s2/2147483647};

  body(-26,-30,14,40);body(-17,-34,20,12);body(24,-48,13,34);body(15,-56,20,11);body(0,2,24,96);

function nearPath(x,y,d){for(const p of paths)for(let i=0;i<p.length-1;i++)if(segDist(x,y,p[i][0],p[i][1],p[i+1][0],p[i+1][1])<d)return true;return false}
function inW(w,x,y,pad){const a=(x-w.x)/(w.rx+pad),b=(y-w.y)/(w.ry+pad);return a*a+b*b<1}

function blocked(x,y){
  if(mapIdx===0&&(Math.hypot(x-VIL.x,y-VIL.y)<250||Math.hypot(x-BASE.x,y-BASE.y)<200||Math.hypot(x-BENCH.x,y-BENCH.y)<80))return true;

  for(const p of portals)if(Math.hypot(x-p.x,y-p.y)<170)return true;
  if(Math.hypot(x-entryW.x,y-entryW.y)<120||Math.hypot(x-entryE.x,y-entryE.y)<120)return true;
  if(Math.hypot(x-BOSS_SPOT.x,y-BOSS_SPOT.y)<200)return true;

  for(const t of trees)if(Math.abs(x-t.x)<58&&Math.hypot(x-t.x,y-t.y)<58)return true;
  for(const r of rocks)if(Math.hypot(x-r.x,y-r.y)<50)return true;
  return false;
}

function melody(key,rest){let s=7;for(const ch of key)s=(s*31+ch.charCodeAt(0))%2147483647;const q=()=>{s=(s*16807)%2147483647;return s/2147483647};const a=[];for(let k=0;k<32;k++)a.push(q()<rest?null:Math.floor(q()*9));return a}
function noteOn(m,t,dur,type,vol,a,filt){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(filt){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;o.connect(f);f.connect(g)}else o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+.05)}
function noiseHit(t,dur,vol,type,freq){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(musicGain);s.start(t,Math.random()*1.5);s.stop(t+dur+.02)}
function kick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.3)}
const chordNotes=(T,deg)=>[0,2,4].map(k=>{const i=deg+k;return T.root+T.sc[i%7]+12*Math.floor(i/7)});
function playStep(T,step,t,sd){
  const bar=Math.floor(step/16)%T.pr.length,s=step%16,ch=chordNotes(T,T.pr[bar]),bl=sd*16;
  if(s===0)for(const n of ch){noteOn(n,t,bl*1.05,'sawtooth',.016,.35,750);noteOn(n+12,t,bl*1.05,'triangle',.012,.4)}
  if(T.arp){if(s%2===0)noteOn(ch[0]-12+(s%4===2?12:0),t,sd*1.6,'triangle',.08,.005);noteOn(ch[(s>>0)%3]+24,t,sd*.9,'square',.012,.003,2600)}
  else if(s===0||s===8||(T.dr>=2&&(s===6||s===14)))noteOn(ch[0]-12,t,sd*(T.dr>=2?2.5:6),'triangle',.075,.01);
  if(s%2===0){const mi=mus.mel[Math.floor(step/2)%32];if(mi!==null){const n=T.root+12+T.sc[mi%7]+(mi>=7?12:0);
    if(T.ld==='bell'){noteOn(n+12,t,sd*5,'sine',.045,.005);noteOn(n+24,t,sd*2,'triangle',.01,.005)}
    else if(T.ld==='flute')noteOn(n+12,t,sd*3.2,'sine',.05,.06);else noteOn(n+12,t,sd*1.6,'triangle',.05,.005,2400)}}
  if(T.dr>=1&&(T.arp?s%2===1:s%4===2))noiseHit(t,.04,T.dr>=3?.05:.03,'highpass',7000);
  if(T.dr>=2){if(s%4===0||(T.dr>=3&&(s===10||s===3)))kick(t,T.dr>=3?.34:.26);if(s===4||s===12)noiseHit(t,.14,T.dr>=3?.15:.08,'bandpass',1800)}
}

function musicTick(){if(!AC||AC.state!=='running'||!noiseBuf)return;
  const key=curTheme();
  if(key!==mus.key&&(mus.key===null||mus.step%16===0)){mus.key=key;const hy=SET.mstyle!=='chill';mus.T=(hy?MUSIC_HYPE:MUSIC)[key];mus.mel=melody(key+(hy?'h':''),hy?.18:.32);mus.step=0;mus.next=Math.max(mus.next,AC.currentTime+.06)}

  while(mus.next<AC.currentTime+.18){if(SET.music>0)playStep(T,mus.step,mus.next,sd);mus.step++;mus.next+=sd}

  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}

  musicGain=AC.createGain();musicGain.connect(comp);sfxGain=AC.createGain();sfxGain.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;

}

function decorate(){

  put('bag','bag');put('home','home');put('party','users');put('setb','gear');put('profb','user');put('rankb','trophy');put('wardb','shirt');put('devb','gear');
  for(const b of $('act').children){const sm=b.querySelector('small');b.innerHTML=icon({fish:'rod',sit:'chair',lie:'bed',dance:'music',wave:'hand'}[b.dataset.p]);b.appendChild(sm);b.classList.add('fxb','teal')}
  $('atk').classList.add('fxb','red');['s1','s2','s3'].forEach(i=>$(i).classList.add('fxb','vio'));$('ctx').classList.add('fxb','blue');
  $('sidetog').classList.add('fxt');$('acttog').classList.add('fxt');
}

function genDict(){const d=Object.assign({},DICT);
  const sl={Pedang:'Sword',Tongkat:'Staff',Busur:'Bow',Perisai:'Shield','Kitab Sihir':'Spellbook','Tabung Panah':'Quiver',Helm:'Helm','Baju Zirah':'Armor','Sarung Tangan':'Gloves',Kasut:'Boots'};
  const mt={Besi:'Iron',Kristal:'Crystal',Suria:'Solar',Naga:'Dragon'};
  for(const k in sl){d[k]=sl[k];for(const m in mt)d[k+' '+m]=mt[m]+' '+sl[k]}for(const k of Object.keys(d))if(k.includes('&'))d[k.replace(/&/g,'&amp;')]=d[k].replace(/&/g,'&amp;');return d}
let TRX=null;const trCache=new Map();
function tr(s){if(SET.lang!=='en'||s==null)return s;s=String(s);let r=trCache.get(s);if(r!==undefined)return r;
  if(!TRX){const d=genDict(),keys=Object.keys(d).sort((a,b)=>b.length-a.length);TRX={d,re:new RegExp('(^|[^A-Za-zÀ-ÿ])('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-zÀ-ÿ])','g')}}
  r=s.replace(TRX.re,(m,a,b)=>a+TRX.d[b]);if(trCache.size>4000)trCache.clear();trCache.set(s,r);return r}
let UT=[];const U=s=>{UT.push(esc(s));return'\u0002'+(UT.length-1)+'\u0003'};
function finishHTML(h){const r=tr(h).replace(/\u0002(\d+)\u0003/g,(m,i)=>UT[+i]||'');UT=[];return r}

const dlg=$('dlg'),dWho=dlg.querySelector('.who'),dTxt=dlg.querySelector('.txt');
let D=null;
function openDialog(who,lines,cb){lines=lines.map(tr);D={who,lines,cb,i:0,c:0};dWho.textContent=tr(who);dTxt.textContent='';dlg.classList.add('show')}
function advance(){if(!D)return;const L=D.lines[D.i];if(D.c<L.length){D.c=L.length;dTxt.textContent=L;return}
  D.i++;D.c=0;if(D.i>=D.lines.length){const cb=D.cb;D=null;dlg.classList.remove('show');cb&&cb();save()}}
dlg.addEventListener('pointerdown',e=>{e.preventDefault();advance()});
function tickDialog(dt){if(!D)return;const L=D.lines[D.i];if(D.c<L.length){const prev=Math.floor(D.c);D.c=Math.min(L.length,D.c+dt*55);if(Math.floor(D.c)!==prev&&Math.floor(D.c)%3===0)sfx.blip();dTxt.textContent=L.slice(0,Math.floor(D.c))}}
let bannerT=0;
function banner(h,p,t=3.2,col){const b=$('banner'),h2=b.querySelector('h2');h2.textContent=tr(h);h2.style.color=col||'#ffd979';b.querySelector('p').textContent=tr(p);b.classList.add('show');bannerT=t}
function fl(x,y,t,c,big){floats.push({x,y,t:tr(t),c,life:big?1.6:1.1,big})}
function addRes(k,n,x,y){if(n<=0)return;res[k]+=n;fl((x||hero.x)+R(-10,10),(y||hero.y)-50-R(0,15),`+${n} ${RES_INFO[k][0]}`,'#fff4c9')}
function salvage(it,quiet){const g={besi:1+it.rar+Math.floor(it.tier/2),gel:1};if(it.rar>=2)g.permata=it.rar-1;for(const k in g)res[k]+=g[k];
  if(!quiet)fl(hero.x,hero.y-60,`Lerai: ${Object.entries(g).map(([k,v])=>'+'+v+RES_INFO[k][0]).join(' ')}`,'#cfe8ff')}
function addItem(it){
  if(inv.length>=40){salvage(it);fl(hero.x,hero.y-80,'Beg penuh! Item dileraikan','#ffb3b3');return false}
  inv.push(it);newItems++;
  if(it.rar>=2){banner(RAR[it.rar].n.toUpperCase()+'!',it.name,3,RAR[it.rar].c);shake=Math.max(shake,it.rar===3?10:5)}
  sfx.rare(it.rar);return true;
}

let DB=null,UID=null,rankList=[],rankState='loading',lastScoreKey='',scoreT=13,scoreWriting=false,arenaClears=0;
function connectDB(){Promise.all([window.claude.use('db'),window.claude.use('user')]).then(async([db,u])=>{
  if(!db||!u){rankState='off';return}const id=await u.id();if(!id){rankState='off';return}DB=db;UID=id;
  const tm=setTimeout(()=>{if(rankState==='loading')rankState='slow'},10000);
  db.collection('scores').orderBy('s','desc').limit(50).onSnapshot(sn=>{clearTimeout(tm);rankList=sn.docs.map(d=>{const v=d.data()||{};return{id:d.id,n:String(v.n||'?').slice(0,14),c:CLASSES[v.c]?v.c:'warrior',l:+v.l|0,s:+v.s|0,b:+v.b|0,m:+v.m|0}});if(rankState!=='ro')rankState='ok';if(modalKind==='rank')renderModal()},()=>{clearTimeout(tm);rankState='err'});
}).catch(()=>{rankState='off'})}
const mythicCount=()=>[...inv,...SLOTS.map(s=>eq[s]).filter(Boolean)].filter(i=>i.rar===3).length;
function calcScore(){let s=hero.lvl*100+bossDown.filter(Boolean).length*1000+baseLv*150+arenaClears*300;for(const sl of SLOTS){const it=eq[sl];if(it)s+=[20,60,180,500][it.rar]*it.tier/2+(it.up||0)*40}return Math.round(s)}
function pushScore(){if(!DB||!UID||!started||scoreWriting||rankState==='ro')return;const sc=calcScore(),key=sc+'|'+myName()+'|'+cls+'|'+hero.lvl;if(key===lastScoreKey)return;scoreWriting=true;
  DB.doc('scores/'+UID).set({n:myName(),c:cls,g:gender,l:hero.lvl,s:sc,b:bossDown.filter(Boolean).length,m:mythicCount()}).then(()=>{lastScoreKey=key}).catch(e=>{if(e&&e.code==='invalid_argument')rankState='ro'}).finally(()=>{scoreWriting=false})}
function rankHTML(){
  let h=`<h3>🏆 Ranking<button class="x" data-a="close">✕</button></h3>`;
  const sc=calcScore(),pos=rankList.findIndex(r=>r.id===UID);
  h+=`<div class="mrow cur"><div class="mi">⭐</div><div class="mt"><b>Skor kamu: ${started||getSave()?sc.toLocaleString():'—'}</b><br>${pos>=0?`Kedudukan #${pos+1}`:''}</div></div>`;
  if(rankState==='off')h+='<div class="note">Ranking perlukan sambungan Firebase. Tetapkan dalam menu 👥 Main Bersama.</div>';
  else if(rankState==='ro')h+='<div class="note">Kamu hanya boleh melihat ranking. Minta pemilik game beri akses Contributor untuk hantar skor.</div>';
  if(rankState==='loading')h+='<div class="note">⏳ Memuatkan ranking...</div>';else if(rankState==='slow')h+='<div class="note">Ranking sedang lambat dimuatkan...</div>';
  h+=`<div class="sec">TOP 50</div>`;
  if(!rankList.length&&rankState!=='loading')h+='<div class="empty">Belum ada skor. Main untuk jadi yang pertama!</div>';
  h+=rankList.map((r,k)=>`<div class="mrow ${r.id===UID?'cur':''}"><div class="mi" style="font-size:${k<3?24:15}px;font-weight:900">${['🥇','🥈','🥉'][k]||'#'+(k+1)}</div><div class="mt"><b>${U(r.n)}</b>${r.id===UID?' ⭐':''}<br>${CLASSES[r.c].ic} ${CLASSES[r.c].n} · Tahap ${r.l} · 👑 ${r.b}/${MAPS.length}${r.m?' · ✨'+r.m:''}</div><div style="font:900 15px Cinzel,serif;color:#ffd979">${r.s.toLocaleString()}</div></div>`).join('');
  h+=`<div class="note" style="margin-top:10px;opacity:.75">Skor dikira daripada tahap, bos ditewaskan, pangkalan, kelengkapan & dungeon.</div>`;
  return h}

function friendAct(a,id){
  if(a==='fcopy'){const t=fmtCode(PID);const ok=()=>toast('📋 Kod kawan disalin: '+t);if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>prompt('Kod kawan kamu:',t));else prompt('Kod kawan kamu:',t);return true}
  if(a==='fcode'){const el=document.getElementById('fcin'),v=(el&&el.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!PIDRE.test(v)){toast('⚠️ Kod tak sah. Kod ada 8 huruf/nombor, cth: AB12-CD34');return true}if(v===PID){toast('😅 Itu kod kamu sendiri');return true}if(isFriend(v)){toast('Sudah jadi kawan');return true}
    const Q=fOnline[v];if(Q&&(Q.rq.includes(PID)||Q.ac.includes(PID))){fAdd(Q);return true}fRequest(v);toast('📨 Permintaan dihantar ke '+fmtCode(v));partyRefresh(1);return true}
  if(a==='fadd'){const Q=fOnline[id];if(!Q)return true;if(Q.rq.includes(PID)){fAdd(Q);return true}fRequest(id);toast(`📨 Permintaan kawan dihantar kepada ${Q.n}`);partyRefresh(1);return true}
  if(a==='facc'){const Q=fOnline[id];if(Q)fAdd(Q);return true}
  if(a==='frej'){frej.add(id);fInbox=fInbox.filter(x=>x!==id);partyRefresh(1);return true}
  if(a==='fdel'){const f=friends.find(x=>x.u===id);if(f&&confirm(`Buang ${f.n} dari senarai kawan?`)){friends=friends.filter(x=>x.u!==id);fSave();sendPresence();partyRefresh(1)}return true}
  if(a==='fpclr'){fpend=[];fSave();sendPresence();partyRefresh(1);return true}
  return false}

function arenaPos(){const a=Math.random()*TAU;return{x:800+Math.cos(a)*R(380,600),y:600+Math.sin(a)*R(240,400)}}
function spawnWave(){const A=arena;
  if(A.mode==='wave'){const n=3+A.wave*2;for(let k=0;k<n;k++){const mi=RI(0,A.top),[arch,o]=MAPS[mi].en[RI(0,1)],p=arenaPos();makeEnemy(arch,o,false,p.x,p.y,A.top,A.D).range=3000}

  const wd=Math.min(150,Math.max(...L.map(l=>ctx.measureText(l).width)))+14,ht=L.length*13+8;
